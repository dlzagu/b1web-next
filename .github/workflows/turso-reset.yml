name: 공유 DB 초기화

# 배포본은 모든 방문자가 같은 DB 를 본다. 데모로 만든 문서·취소 흔적이 쌓이면
# README 수치·스크린샷과 어긋나므로 매일 원상복구한다.
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch: # 수동 실행 (버튼)

# 동시에 두 번 돌면 서로의 적재를 덮어쓴다 — 앞선 실행이 끝날 때까지 기다린다
concurrency:
  group: turso-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    # 시크릿이 없는 포크에서는 조용히 건너뛴다(실패로 안 잡히게)
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 공유 DB 초기화 (전체 삭제 → 가상 시드 재생성)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run turso:reset

      # 리셋이 '돌았다'가 아니라 '맞게 들어갔다'까지 본다 — 화면이 쓰는 조회 경로로 재확인
      - name: 초기화 결과 점검 (읽기 전용)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run turso:verify
